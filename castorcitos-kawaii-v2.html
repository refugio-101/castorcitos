<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castorcitos Kawaii</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Sniglet:wght@800&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   CONFIGURACIÓN RÁPIDA — cambia colores y velocidades aquí
   ====================================================================== */
:root{
  --bg:#ffe9f1; --dots:#ffd3e4; --card:#fff8e7; --ink:#6b3f58;
  --fresa:#ff7fae; --cielo:#cde7ff; --log:#c9924f; --log2:#8a5a37;
  --grass:#9be27c; --grass2:#79cf5f;
  --dur-rise:.4s; --dur-hide:.3s; --dur-hit:.35s; --dur-sway:1.1s; /* duraciones de animación */
  --amp:1; /* amplitud global de movimiento: baja a .5 si te parece exagerado, sube a 1.5 si lo quieres más */
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3b2545;--dots:#4a2f57;--card:#54386a;--ink:#ffe9f1;--grass:#3f8f57;--grass2:#337a49;--cielo:#4a6d94}}
:root[data-theme="dark"]{--bg:#3b2545;--dots:#4a2f57;--card:#54386a;--ink:#ffe9f1;--grass:#3f8f57;--grass2:#337a49;--cielo:#4a6d94}

/* --- Estaciones: color del césped en cada una (primavera usa el de arriba) --- */
.field[data-season="ver"]{--grass:#c9e46a;--grass2:#a8cf4a}
.field[data-season="oto"]{--grass:#d6d36a;--grass2:#b8b44a} /* verde oliva dorado: el marrón se confundía con los castores */
.field[data-season="inv"]{--grass:#eaf4fb;--grass2:#cfe2f1}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .field[data-season="ver"]{--grass:#6f8f3a;--grass2:#5b7a2e}
  :root:not([data-theme="light"]) .field[data-season="oto"]{--grass:#6f7a36;--grass2:#5c6630}
  :root:not([data-theme="light"]) .field[data-season="inv"]{--grass:#5d7389;--grass2:#4c6177}
}
:root[data-theme="dark"] .field[data-season="ver"]{--grass:#6f8f3a;--grass2:#5b7a2e}
:root[data-theme="dark"] .field[data-season="oto"]{--grass:#6f7a36;--grass2:#5c6630}
:root[data-theme="dark"] .field[data-season="inv"]{--grass:#5d7389;--grass2:#4c6177}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg) radial-gradient(var(--dots) 18%,transparent 20%) 0 0/28px 28px;color:var(--ink);font-family:"Fredoka","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;display:flex;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
main{width:100%;max-width:480px;padding:0 14px 14px}
.pinned{position:sticky;top:0;z-index:8;padding-top:14px;background:var(--bg) radial-gradient(var(--dots) 18%,transparent 20%) 0 0/28px 28px;box-shadow:0 8px 10px -8px rgba(0,0,0,.25)}
h1{margin:6px 0 10px;text-align:center;font-size:1.7rem;font-weight:600;color:var(--fresa);text-shadow:0 3px 0 #fff}
.hud{display:flex;gap:10px;margin-bottom:46px}
.pill{flex:1;contain:content;background:var(--card);border-radius:22px;padding:8px 12px;text-align:center;border:3px solid #fff;box-shadow:0 4px 0 rgba(255,127,174,.35)}
.pill b{display:block;font-size:1.5rem;line-height:1.1}
.pill span{font-size:.8rem;opacity:.8}

/* --- Textura del césped: cambia el <svg> de aquí dentro para otra textura --- */
.field{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative;cursor:none;
  border-radius:28px;padding:12px;border:4px solid #fff;box-shadow:0 6px 0 rgba(107,63,88,.15);
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' viewBox='0 0 56 56'><g fill='none' stroke-linecap='round' stroke-width='2.6'><path d='M8 18l-2-8M8 18l3-7M8 18l6-5M38 12l-2-8M38 12l3-7M38 12l6-5M22 44l-2-8M22 44l3-7M22 44l6-5' stroke='%2357b846'/><path d='M50 46l-1-6M50 46l3-5M30 26l-1-5M30 26l3-4' stroke='%23c4f7a5'/></g><circle cx='46' cy='24' r='2.6' fill='%23fff'/><circle cx='12' cy='42' r='2.2' fill='%23ffd6e7'/></svg>") 0 0/56px 56px,
    linear-gradient(var(--grass),var(--grass2));
}
.hole,.log{position:relative;aspect-ratio:1}

/* Agujero: fondo oscuro + borde de tierra, sin ningún cuadrado detrás del castor */
.back{position:absolute;left:10%;right:10%;bottom:16%;height:30%;border-radius:50%;background:radial-gradient(#241713,#4a2f22);border:4px solid var(--log2);z-index:0}
.lip{position:absolute;left:3%;right:3%;bottom:2%;height:26%;border-radius:50%;background:linear-gradient(var(--log),var(--log2));border-bottom:5px solid var(--log2);z-index:2;pointer-events:none;overflow:hidden}
.lip::before{content:"";position:absolute;inset:0;background:
  repeating-radial-gradient(ellipse 150% 260% at 50% 120%,
    transparent 0 5%, rgba(74,44,26,.4) 5% 6.5%, transparent 6.5% 11%)}
.pit{position:absolute;inset:0;z-index:1;clip-path:inset(-60% -30% 24% -30%)}
.flower{position:absolute;width:15%;z-index:3;pointer-events:none;animation:flsway 2.6s ease-in-out infinite;transform-origin:bottom center}
.flower.a{left:0%;top:4%}
.flower.b{right:0%;top:8%;animation-delay:.6s}
@keyframes flsway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

/* ======================================================================
   EL CASTOR — 4 estados, sin clases compartidas con nada más del CSS
   mole            → escondido (estado por defecto)
   mole--rising    → animación de salir (un ciclo, luego pasa a --idle)
   mole--idle      → balanceo + mordisco en bucle mientras está fuera
   mole--hiding    → animación de escape sin golpe (un ciclo, luego vuelve a mole)
   mole--hit       → animación de golpe con éxito (un ciclo, luego vuelve a mole)
   Tipos (se suman al estado): gold · bebe · casco · erizo
   ====================================================================== */
.mole{position:absolute;left:19%;width:62%;bottom:30%;transform-origin:bottom center;transform:translateY(125%) scaleY(.6);--m:#c58e63}
.mole.gold{--m:#ffcf4d;filter:drop-shadow(0 0 8px #fff2a8)}
.mole.bebe{--m:#e8c09a}
.mole.bebe svg{transform:scale(.78);transform-origin:50% 100%}
.mole svg{display:block;width:100%;height:auto;overflow:visible}
.helmet{transform-origin:60px 30px}
.helmet.off{animation:helmoff .5s ease-out forwards}
@keyframes helmoff{to{transform:translate(34px,-70px) rotate(50deg);opacity:0}}

.mole--rising{animation:rise var(--dur-rise) cubic-bezier(.22,1.6,.4,1) forwards}
.mole--idle{transform:translateY(0) scaleY(1);animation:sway var(--dur-sway) ease-in-out infinite}
.mole--hiding{animation:hide var(--dur-hide) cubic-bezier(.6,-.2,.8,.2) forwards}
.mole--hit{animation:hit var(--dur-hit) ease-out forwards}

@keyframes rise{
  0%{transform:translateY(125%) scaleY(.55) rotate(0)}
  55%{transform:translateY(calc(-14% * var(--amp))) scaleY(1.14) rotate(calc(-5deg * var(--amp)))}
  78%{transform:translateY(calc(4% * var(--amp))) scaleY(.95) rotate(calc(3deg * var(--amp)))}
  100%{transform:translateY(0) scaleY(1) rotate(0)}
}
@keyframes sway{
  0%,100%{transform:translateY(0) rotate(calc(-4deg * var(--amp)))}
  50%{transform:translateY(calc(-10% * var(--amp))) rotate(calc(4deg * var(--amp)))}
}
@keyframes hide{
  0%{transform:translateY(0) scaleY(1) rotate(0)}
  30%{transform:translateY(calc(-18% * var(--amp))) scaleY(1.15) rotate(calc(6deg * var(--amp)))}
  100%{transform:translateY(125%) scaleY(.5) rotate(0)}
}
@keyframes hit{
  0%{transform:translateY(0) scale(1) rotate(0)}
  30%{transform:translateY(calc(-8% * var(--amp))) scale(1.3,.6) rotate(calc(-9deg * var(--amp)))}
  65%{transform:translateY(45%) scale(.85,.85) rotate(calc(10deg * var(--amp)))}
  100%{transform:translateY(125%) scale(.6,.95) rotate(0)}
}
/* dientes, ramita y virutas: solo se mueven mientras está en --idle */
.mole--idle .teeth{animation:chomp .28s ease-in-out infinite alternate;transform-origin:60px 70px}
.mole--idle .twig{animation:wig .28s ease-in-out infinite alternate;transform-origin:60px 88px}
.mole--idle .chip{animation:chip .6s ease-out infinite}
.mole--idle .chip:nth-of-type(2){animation-delay:.3s}
@keyframes chomp{0%{transform:translateY(0) scaleY(1)}100%{transform:translateY(calc(4px*var(--amp))) scaleY(.55)}}
@keyframes wig{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(calc(3px*var(--amp))) rotate(calc(-6deg*var(--amp)))}}
@keyframes chip{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx,10px),-22px) scale(.4)}}
@media (prefers-reduced-motion:reduce){:root{--amp:.35;--dur-sway:1.6s}.weather{display:none}}

.log svg{display:block;width:100%;height:auto}
.log.gnaw svg{animation:wob .25s ease-in-out infinite alternate}
.log.broken svg{filter:grayscale(.7);transform:rotate(-8deg)}
@keyframes wob{from{transform:rotate(calc(-1.8deg*var(--amp)))}to{transform:rotate(calc(1.8deg*var(--amp)))}}
.hp{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:.9rem;letter-spacing:1px;color:var(--fresa);text-shadow:0 1px 0 #fff,0 0 4px #fff}
.bite{opacity:0;transition:opacity .35s ease}

/* --- Tiempo de cada estación: pétalos, brillos, hojas o nieve cayendo --- */
/* solo se anima transform (cqh = % del alto del campo) para que el navegador no recalcule la página en cada fotograma */
.weather{position:absolute;inset:0;overflow:hidden;border-radius:24px;pointer-events:none;z-index:4;container-type:size}
.wx{position:absolute;top:0;width:5%;animation:wxfall linear infinite;opacity:.9;will-change:transform}
.wx svg{display:block;width:100%}
@keyframes wxfall{0%{transform:translate(0,-10cqh) rotate(0)}50%{transform:translate(14px,46cqh) rotate(160deg)}100%{transform:translate(0,102cqh) rotate(320deg)}}

.over.win{background:rgba(255,244,214,.94)}
.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.petal{position:absolute;top:-10%;width:9%;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20%) rotate(0)}100%{transform:translateY(480%) rotate(300deg)}}
.fl{position:absolute;left:50%;top:30%;z-index:5;font-weight:600;font-size:1.3rem;color:#fff;text-shadow:0 2px 0 var(--fresa),0 0 6px var(--fresa);pointer-events:none;animation:fl .7s ease-out forwards;white-space:nowrap}
.fl.bad{text-shadow:0 2px 0 #9b3b5a,0 0 6px #c0406a;font-size:1.05rem}
.fl.small{font-size:.95rem;opacity:.9}
.fl.big{top:42%;font-size:2rem;animation-duration:1s}
@keyframes fl{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-40px);opacity:0}}
.over{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border-radius:24px;background:rgba(255,233,241,.92);color:#6b3f58;cursor:pointer;padding:12px}
.over.show{display:flex}
.over b{font-size:2.4rem;color:var(--fresa);-webkit-text-stroke:2px #fff;text-shadow:0 4px 0 #fff}
.over small{margin-top:6px;background:var(--fresa);color:#fff;padding:6px 14px;border-radius:16px;font-weight:600;font-size:.9rem}
.over .rec{font-weight:600;color:var(--fresa)}
.over.start small{font-size:1.2rem;padding:8px 26px}
#hammer{position:fixed;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:50;transform-origin:32px 19px;display:none;transition:transform .05s linear}
#hammer.on{display:block}
#hammer svg{width:100%;height:100%;display:block}
.hud{position:relative}
.helper{position:absolute;top:100%;left:4px;width:56px;z-index:6;pointer-events:none;margin-top:2px}
.helper2{left:auto;right:4px}
.helper2:not(.active){display:none}
.attpill{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;font-size:.75rem;font-weight:600;color:var(--ink);opacity:.85;text-align:center;line-height:1.35;width:calc(100% - 130px)}
.attpill .cmb{color:var(--fresa)}
.helper svg{display:block;width:100%;overflow:visible}
.helper.active g.ear:nth-of-type(1),.helper.active g.ear:nth-of-type(2){animation:earwig var(--hs,1.1s) ease-in-out infinite}
.helper.active .pick{animation:pickfl var(--hs,1.1s) ease-in-out infinite}
.helper:not(.active) .pick{opacity:0}
.helper2.active .tail{animation:tailwag .9s ease-in-out infinite}
body.held .helper *,body.held .flower,body.held .wx{animation-play-state:paused!important} /* en pausa, todo quieto */
.acorn{position:fixed;left:0;top:0;width:38px;height:38px;pointer-events:none;z-index:40;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.acorn svg{display:block;width:100%}
@keyframes earwig{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
@keyframes pickfl{0%{opacity:0;transform:translate(4px,4px) scale(.3)}25%{opacity:1;transform:translate(0,-6px) scale(.8)}55%{opacity:1;transform:translate(10px,-20px) scale(.9)}80%{opacity:0;transform:translate(16px,-30px) scale(.5)}100%{opacity:0}}
@keyframes tailwag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
h2{font-size:1.1rem;margin:16px 4px 8px}
h2 span{font-size:.85rem;opacity:.7;font-weight:400}
/* --- Mejoras: botones compactos (icono + nombre + explicación corta + precio); la descripción larga sale al pasar el ratón --- */
.ups{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.up{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:7px;width:100%;text-align:left;font:inherit;font-size:.78rem;line-height:1.2;color:inherit;background:var(--card);border:2px solid #fff;border-radius:14px;padding:5px 8px;box-shadow:0 3px 0 rgba(107,63,88,.15);cursor:pointer}
.up .ic{font-size:1.3rem}
.up .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.up strong,.up small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up small{font-size:.7rem;opacity:.75}
.up:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(107,63,88,.15)}
.up:disabled{opacity:.55;cursor:default}
.up.max{opacity:.8}
.up:focus-visible,.hole:focus-visible,.reset:focus-visible,.st:focus-visible{outline:3px solid var(--fresa);outline-offset:2px}
.price{background:var(--cielo);border-radius:10px;padding:2px 7px;font-weight:600;white-space:nowrap}

/* --- Pegatinas (logros) --- */
.stk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.st{aspect-ratio:1;border-radius:50%;background:var(--card);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font:inherit;font-size:1.25rem;color:inherit;padding:0;box-shadow:0 3px 0 rgba(107,63,88,.15);cursor:pointer}
.st.lock{font-size:1rem;opacity:.4;font-weight:600}
.st.new{animation:stnew .6s ease-out}
@keyframes stnew{0%{transform:scale(.3) rotate(-30deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}

.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin:14px 4px;font-size:.85rem}
.foot label{display:flex;align-items:center;gap:5px;cursor:pointer}
.tbtn{font:inherit;font-weight:600;color:inherit;background:var(--card);border:2px solid #fff;border-radius:14px;padding:4px 10px;box-shadow:0 3px 0 rgba(107,63,88,.15);cursor:pointer}
.tbtn:focus-visible{outline:3px solid var(--fresa);outline-offset:2px}
/* número de tecla en cada agujero: solo en modo teclado */
.key{display:none;position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:5;pointer-events:none;font-family:"Sniglet","Fredoka",sans-serif;font-weight:800;font-size:1.35rem;line-height:1;color:var(--fresa);text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,1.5px 1.5px #fff,-1.5px 1.5px #fff,1.5px -1.5px #fff,-1.5px -1.5px #fff,0 4px 0 rgba(107,63,88,.35)}
body.kbd .key{display:block}
.reset{font:inherit;color:inherit;background:none;border:2px dashed currentColor;border-radius:14px;padding:4px 10px;opacity:.7;cursor:pointer}
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;width:max-content;max-width:90%;pointer-events:none}
.toast{background:var(--fresa);color:#fff;padding:10px 16px;border-radius:20px;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.15);text-align:center}
/* --- Distribución: en pantalla estrecha, todo en columna (juego, mejoras, pegatinas);
       en ancha, pegatinas a la izquierda, juego en el centro y mejoras a la derecha --- */
.layout{display:flex;flex-direction:column}
.pinned{order:1}.side{order:2}.stickers{order:3}
@media (min-width:760px){
  main{max-width:1120px}
  .layout{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,540px) minmax(220px,260px);grid-template-areas:"l g r";justify-content:center;gap:18px;align-items:start}
  .stickers{grid-area:l}.pinned{grid-area:g}.side{grid-area:r}
  .ups{grid-template-columns:1fr}
  .stk{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<main>
  <h1>Castorcitos ♡</h1>
  <div class="layout">
    <div class="stickers">
      <h2>Pegatinas <span id="stcount"></span></h2>
      <div class="stk" id="stk"></div>
    </div>
    <div class="pinned">
      <div class="hud">
        <div class="pill"><b id="coins">0</b><span>flores ✿</span></div>
        <div class="pill"><b id="ips">0</b><span>por segundo</span></div>
        <div class="pill"><b id="tot">0</b><span>castores</span></div>
        <div class="helper" id="helper"></div>
        <div class="helper helper2" id="helper2"></div>
        <div class="attpill" id="attpill"></div>
      </div>
      <div class="field" id="field"><div class="weather" id="weather"></div></div>
    </div>
    <div class="side">
      <h2>Mejoras</h2>
      <div class="ups" id="ups"></div>
      <div class="foot">
        <button class="tbtn" id="pause">⏸ Pausa</button>
        <button class="tbtn" id="mode"></button>
        <label><input type="checkbox" id="sound"> Sonido y vibración</label>
        <label><input type="checkbox" id="slow"> Ver animación despacio</label>
        <button class="reset" id="reset">Borrar partida</button>
      </div>
    </div>
  </div>
</main>
<div id="hammer"></div>
<div class="toasts" id="toasts"></div>
<script>
/* ======================================================================
   TEXTURAS — cambia estos SVG para dar otro aspecto a personajes/tronco
   ====================================================================== */
/* Color de ojos de cada castor: 8 tonos repartidos por el círculo de color para que no se confundan */
const EYES=['#ff4d5e','#ff9a2e','#ffd23f','#43c96b','#22c7c7','#3f7bff','#9b5cff','#ff5fc1'];
/* Ojo: todo del color del castor, sin pupila, con dos brillos (tamaño pensado para que sea tierno, no inquietante) */
const EYE=(x,c)=>`<ellipse cx="${x}" cy="55" rx="6.15" ry="7.2" fill="${c}" stroke="#4a2c3a" stroke-width="1.3"/><circle cx="${x-1.95}" cy="52.45" r="1.95" fill="#fff" stroke="none"/><circle cx="${x+2.1}" cy="58.45" r="1" fill="#fff" stroke="none"/>`;
/* Casco del castor con casco: se cae al primer golpe */
const HELMET=`<g class="helmet"><path d="M20 42Q22 8 60 8Q98 8 100 42Z" fill="#ffd24a"/><rect x="12" y="37" width="96" height="10" rx="5" fill="#ffc21a"/><path d="M60 9v28M44 14v24M76 14v24" fill="none" stroke-width="1.6"/></g>`;

/* Tronco. Los mordiscos recortan el tronco de verdad (máscara): se ve el césped a través,

const BITES=[[16,62,11],[104,70,10],[17,91,10],[103,94,9]];
const biteShape=(cx,cy,R,n=7)=>{ // círculo hecho de semicírculos hacia fuera = huella de dientes
  const rs=(R*Math.sin(Math.PI/n)).toFixed(2);let d='';
  for(let k=0;k<=n;k++){const a=2*Math.PI*k/n-Math.PI/2,x=(cx+R*Math.cos(a)).toFixed(2),y=(cy+R*Math.sin(a)).toFixed(2);d+=k?`A${rs} ${rs} 0 0 1 ${x} ${y}`:`M${x} ${y}`}
  return d+'Z';
};

let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d,type,vol,when,f2){
  if(S.mute)return;const a=ac();if(!a)return;
  const t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);
}

  n++;
  el.addEventListener('pointerdown',()=>whack(c));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();whack(c)}});
  // el propio castor gestiona el final de cada animación de un solo ciclo
  c.m.addEventListener('animationend',ev=>{
    if(ev.animationName==='rise'&&c.up) c.m.className='mole mole--idle'+cls(c);
    if(ev.animationName==='hide'||ev.animationName==='hit'){c.m.className='mole';c.busy=false}
  });
  field.appendChild(el);cells.push(c);byKey[KEYS[i]]=c;
}
/* "busy": el agujero está terminando una animación y no puede salir otro castor todavía */
function setBusy(c){c.busy=true;clearTimeout(c.bt);c.bt=setTimeout(()=>c.busy=false,1000)}
function float(el,t,k){const f=document.createElement('div');f.className='fl'+(k?' '+k:'');f.textContent=t;el.appendChild(f);setTimeout(()=>f.remove(),1000)}

function renderLog(){
  const mx=hpMax();
  logEl.classList.toggle('gnaw',!over&&!paused&&cells.some(c=>c.up&&!c.hit&&c.type!=='erizo'));
  logEl.classList.toggle('broken',over||paused);
  setText(hpEl,'♥'.repeat(hp)+'♡'.repeat(mx-hp));
  const se=SEASONS[stage()%4];
  setHTML(attpill,'Intentos: '+S.att+' · '+se.n+(stage()>=4?' '+(stage()+1):'')+' '+(S.round%PER_STAGE)+'/'+PER_STAGE
    +(combo>=2?'<br><span class="cmb">Combo '+combo+(comboMult(combo)>1?' · x'+comboMult(combo):'')+'</span>':''));
  const shown=Math.ceil(BITES.length*(mx-hp)/mx),face=hp/mx<=.25?MOUTH.sad : hp/mx<=.6?MOUTH.neutral : MOUTH.happy;
  if(logEl._shown!==shown){logEl._shown=shown;bites.forEach(b=>b.style.opacity=shown>+b.dataset.i?'1':'0')}
  if(mouth.getAttribute('d')!==face)mouth.setAttribute('d',face);
}
function setSeason(){
  const se=SEASONS[stage()%4];
  if(field.dataset.season===se.k)return;
  field.dataset.season=se.k;
  weather.innerHTML='';
  for(let i=0;i<9;i++){
    const w=document.createElement('div');w.className='wx';w.innerHTML=se.wx(i);
    w.style.left=(Math.random()*95)+'%';
    const d=5+Math.random()*4;w.style.animationDuration=d+'s';w.style.animationDelay=(-Math.random()*d)+'s';
    weather.appendChild(w);
  }
}
function hideAll(){cells.forEach(c=>{clearTimeout(c.to);c.up=false;c.busy=false;c.m.className='mole'})}
function bite(){
  if(over||paused||slow)return; // en modo lento no hay penalización, es solo para mirar
  hp--;SFX.bite();vib(40);
  if(hp<=0){
    hp=0;hideAll();
    S.att--;
    if(S.att<=0) gameOver();
    else{
      paused=true;
      toast('¡Se rompió el tronco! Te quedan '+S.att+' intentos');
      pauseTimer=setTimeout(()=>{hp=hpMax();paused=false;renderLog()},3200);
    }
    save();
  }
  renderLog();
}
function pop(c){
  c.up=true;c.hit=false;c.hits=0;
  const st=stage(),r=Math.random();
  c.type=st>=1&&r<.12?'erizo':st>=2&&r<.24?'bebe':st>=3&&r<.34?'casco':'normal';
  c.gold=c.type==='normal'&&Math.random()<goldP();
  // el dibujo solo se rehace si cambia de personaje; si no, basta con volver a ponerle el casco
  const kind=c.type==='erizo'?'erizo':c.type==='casco'?'casco':'castor';
  if(c.kind!==kind){c.kind=kind;c.m.innerHTML=kind==='erizo'?ERIZO:beaver(c.eye,c.eye,kind==='casco')}
  else if(kind==='casco')c.m.querySelector('.helmet').classList.remove('off');
  c.m.className='mole mole--rising'+cls(c);
  const k={bebe:.6,casco:1.3,erizo:1.1}[c.type]||1;
  const stay=slow?6000:1300*hard()*k;c.dl=performance.now()+stay; // dl = cuándo se escapará
  c.to=setTimeout(()=>escape(c),stay);
  renderLog();
}
function escape(c){
  if(!c.up||c.hit)return;
  c.up=false;setBusy(c);c.m.className='mole mole--hiding'+cls(c);
  if(c.type==='erizo'){S.dodges++;renderLog();return} // el erizo se va sin morder
  if(S.m>0&&!over&&!paused){const g=val()*.1*S.m;S.c+=g;float(c.el,'+'+fmt(g)+' ✿','small')}
  combo=0;
  bite();
}
/* auto = golpe de una bellota de la ardilla: da flores pero no suma ni rompe tu combo */
function whack(c,auto){
  if(!c.up){
    // tocar un agujero vacío rompe el combo
    if(!c.busy&&playing()&&combo){combo=0;renderLog()}
    return;
  }
  if(c.type==='erizo'){
    c.hit=true;c.up=false;clearTimeout(c.to);setBusy(c);c.m.className='mole mole--hit'+cls(c);
    const loss=Math.min(S.c,val()*5);S.c-=loss;combo=0;
    SFX.erizo();vib([30,40,30]);float(c.el,'¡Pincha! -'+fmt(loss)+' ✿','bad');
    render();renderLog();return;
  }
  if(c.type==='casco'&&c.hits===0){
    c.hits=1;c.m.querySelector('.helmet').classList.add('off');
    SFX.clank();if(!auto)vib(20);float(c.el,'¡Clonk!','small');
    const stay=slow?6000:800;c.dl=performance.now()+stay;
    clearTimeout(c.to);c.to=setTimeout(()=>escape(c),stay);
    return;
  }
  c.hit=true;c.up=false;clearTimeout(c.to);setBusy(c);
  const before=comboMult(combo);
  if(!auto){combo++;S.bestCombo=Math.max(S.bestCombo,combo)}
  const cm=auto?1:comboMult(combo),tm=c.gold?10:c.type==='bebe'?2:c.type==='casco'?3:1;
  const v=val()*tm*cm;S.c+=v;S.tot++;S.round++;
  if(c.gold)S.golds++;
  if(c.type==='casco')S.helms++;
  c.m.className='mole mole--hit'+cls(c);
  float(c.el,(auto?'🌰 ':'')+'+'+fmt(v)+' ✿'+(cm>1?' x'+cm:''));
  c.gold?SFX.gold():SFX.hit();if(!auto)vib(15);
  if(!auto&&cm>before){SFX.combo();float(field,'¡Combo x'+cm+'!','big')}
  const st=stage();
  if(st>curStage){
    curStage=st;S.maxStage=Math.max(S.maxStage,st);setSeason();SFX.season();
    toast(SEASONS[st%4].msg||'¡Nivel '+(st+1)+'! Todo va un poco más rápido');
  }
  render();renderLog();
}
function spawn(){
  const free=cells.filter(c=>!c.up&&!c.busy);
  if(playing()&&free.length)pop(free[Math.random()*free.length|0]);
  setTimeout(spawn,gap()*hard()*(slow?4:1)*(.6+Math.random()*.8));
}
setInterval(()=>{if(playing()&&hp<hpMax()){hp++;renderLog()}},4000);

/* Ardilla: cada cierto tiempo tira una bellota a un castor que esté fuera (nunca a un erizo) */
const acornEvery=()=>Math.max(1200,6000-S.a*500); // nivel 1: cada 5,5 s · nivel 10: cada 1,2 s
const ACORN=`<svg viewBox="0 0 20 20" aria-hidden="true"><g stroke="#4a2c3a" stroke-width="1.4" stroke-linejoin="round"><ellipse cx="10" cy="12" rx="5.5" ry="6.5" fill="#b8763e"/><path d="M3.5 9q6.5-7 13 0z" fill="#7a4a26"/><path d="M10 3.5v-2" fill="none"/></g></svg>`;
function throwAcorn(){
  if(S.a>0&&playing()&&!slow){
    const targets=cells.filter(c=>c.up&&!c.hit&&c.type!=='erizo'&&!c.aimed);
    if(targets.length){
      // apunta al que antes se va a escapar, siempre que la bellota llegue a tiempo (vuela 450 ms)
      const now=performance.now(),soon=(a,b)=>a.dl-b.dl;
      const c=(targets.filter(t=>t.dl-now>480).sort(soon)[0])||targets.sort(soon)[0];c.aimed=true;
      const a=helper2.getBoundingClientRect(),b=c.el.getBoundingClientRect();
      const x0=a.left+a.width*.45,y0=a.top+a.height*.7,x1=b.left+b.width/2,y1=b.top+b.height*.45;
      const n=document.createElement('div');n.className='acorn';n.innerHTML=ACORN;document.body.appendChild(n);
      // vuelo en arco: sube un poco y cae sobre el castor
      const r=19,mid=`translate(${(x0+x1)/2-r}px,${Math.min(y0,y1)-60}px) rotate(200deg) scale(1.15)`; // r = mitad del tamaño de la bellota
      n.animate([{transform:`translate(${x0-r}px,${y0-r}px) rotate(0) scale(.8)`},{transform:mid},{transform:`translate(${x1-r}px,${y1-r}px) rotate(400deg) scale(1)`}],{duration:450,easing:'ease-in',fill:'forwards'});
      setTimeout(()=>{n.remove();c.aimed=false;if(c.up&&!c.hit)whack(c,true)},450);
    }
  }
  setTimeout(throwAcorn,acornEvery());
}

$('#slow').addEventListener('change',e=>{slow=e.target.checked});
const snd=$('#sound');snd.checked=!S.mute;
snd.addEventListener('change',e=>{S.mute=!e.target.checked;if(!S.mute){ac();SFX.buy()}save()});

/* Pausa: esconde los castores (sin morder) y congela castores, ardilla y corazones */
const pz=document.createElement('div');pz.className='over';
pz.innerHTML='<b>PAUSA</b><span>Los castores esperan escondidos</span><small>Toca (o pulsa P) para seguir</small>';
function pauseGame(){if(!started||over||hold)return;hold=true;document.body.classList.add('held');hideAll();pz.classList.add('show');setText(pauseBtn,'▶ Seguir');renderLog();render()}
function resumeGame(){if(!hold)return;hold=false;document.body.classList.remove('held');pz.classList.remove('show');setText(pauseBtn,'⏸ Pausa');renderLog();render()}
pz.addEventListener('click',resumeGame);
field.appendChild(pz);
const pauseBtn=$('#pause');pauseBtn.addEventListener('click',()=>hold?resumeGame():pauseGame());

/* Modo ratón / teclado: en modo teclado cada agujero se golpea con su número (teclado numérico o fila de números) */
const modeBtn=$('#mode');
function setMode(){document.body.classList.toggle('kbd',!!S.kbd);setText(modeBtn,S.kbd?'⌨️ Teclado':'🖱️ Ratón');modeBtn.title=S.kbd?'Cambiar a ratón':'Cambiar a teclado (teclas 1-9)'}
modeBtn.addEventListener('click',()=>{S.kbd=!S.kbd;setMode();save();modeBtn.blur()});
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){hold?resumeGame():pauseGame();return}
  if(!S.kbd)return;
  if(!started&&(e.key==='Enter'||e.key===' ')){e.preventDefault();st0.click();return}
  const k=/^(Digit|Numpad)([1-9])$/.exec(e.code),c=k&&byKey[k[2]];
  if(!c)return;
  e.preventDefault();
  // el martillo baja sobre el agujero pulsado
  const r=c.el.getBoundingClientRect();hx=r.left+r.width*.62;hy=r.top+r.height*.4;ham.classList.add('on');ang=24;place();setTimeout(()=>{ang=-28;place()},110);
  whack(c);
});

/* Pantalla de inicio */
const st0=document.createElement('div');st0.className='over start show';
st0.innerHTML='<b>Castorcitos ♡</b><span>Golpea a los castores antes de que muerdan el tronco.</span><span>Si sale un erizo, ¡déjalo en paz!</span><span class="rec" id="startbest"></span><small>¡Jugar!</small>';
st0.addEventListener('click',()=>{ac();started=true;st0.classList.remove('show');renderLog()});
field.appendChild(st0);

/* Fin de ronda: se guardan las flores y las mejoras, solo empieza otra ronda */
const ov=document.createElement('div');ov.className='over';
ov.innerHTML='<b>¡FIN DE RONDA!</b><span>Se acabaron los intentos</span><span>Castores en esta ronda: <em id="round">0</em></span><span class="rec" id="rec"></span><span>Tus flores y mejoras se quedan ✿</span><small>Toca para otra ronda</small>';
ov.addEventListener('click',()=>{if(over&&Date.now()-overAt>=500)newRound()});
field.appendChild(ov);
function gameOver(){
  over=true;overAt=Date.now();combo=0;
  const rec=S.round>S.best;S.best=Math.max(S.best,S.round);
  win.classList.remove('show');
  ov.querySelector('#round').textContent=S.round;
  ov.querySelector('#rec').textContent=rec?'¡Nuevo récord! ✿':'Récord: '+S.best;
  ov.classList.add('show');SFX.over();vib([60,60,120]);
}
function newRound(){
  clearTimeout(pauseTimer);hideAll();
  S.att=ATT;S.round=0;curStage=0;hp=hpMax();over=false;paused=false;combo=0;
  ov.classList.remove('show');setSeason();save();renderLog();render();
}

const win=document.createElement('div');win.className='over win';
win.innerHTML='<b>¡GANASTE! ✿</b><span>¡Subiste todas las mejoras al máximo!</span><small>Toca para seguir jugando</small><div class="petals"></div>';
const petals=win.querySelector('.petals');
for(let i=0;i<16;i++){
  const p=document.createElement('div');p.className='petal';
  p.innerHTML=FLOWER(FLORES[i%FLORES.length]);
  p.style.left=(Math.random()*100)+'%';
  p.style.animationDelay=(Math.random()*2.4)+'s';
  p.style.animationDuration=(2+Math.random()*1.6)+'s';
  petals.appendChild(p);
}
win.addEventListener('click',()=>win.classList.remove('show'));
field.appendChild(win);
function checkWin(){
  if(!S.won&&!over&&U.every(u=>S[u.k]>=u.max)){S.won=true;save();win.classList.add('show');SFX.win()}
}

const helper=$('#helper');helper.innerHTML=BUNNY;
const helper2=$('#helper2');helper2.innerHTML=SQUIRREL;
const ham=$('#hammer');let hx=0,hy=0,ang=-28,hammerLvl=-1;
const place=()=>ham.style.transform=`translate(${hx-32}px,${hy-19}px) rotate(${ang}deg)`;
field.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;hx=e.clientX;hy=e.clientY;ham.classList.add('on');place()});
field.addEventListener('pointerleave',()=>ham.classList.remove('on'));
field.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;ang=24;place();setTimeout(()=>{ang=-28;place()},110)});

const ups=$('#ups');
U.forEach(u=>{
  const b=document.createElement('button');b.className='up';
  b.innerHTML='<span class="ic" aria-hidden="true">'+u.i+'</span><span class="tx"><strong></strong><small>'+u.e+'</small></span><span class="price"></span>';
  b.title=u.n+': '+u.d;
  b.addEventListener('click',()=>{
    const p=cost(u);if(hold||S[u.k]>=u.max||S.c<p)return; // en pausa no se compra
    S.c-=p;S[u.k]++;SFX.buy();
    if(u.k==='r'){hp=Math.min(hpMax(),hp+1);renderLog()}
    render();checkWin();
  });
  ups.appendChild(b);u.el=b;u.nEl=b.querySelector('strong');u.pEl=b.querySelector('.price');
});
const coinsEl=$('#coins'),ipsEl=$('#ips'),totEl=$('#tot'),startBest=$('#startbest');

const stk=$('#stk');
A.forEach(a=>{
  const b=document.createElement('button');b.className='st';
  b.addEventListener('click',()=>toast(S.ach[a.id]?a.e+' '+a.n:'🔒 '+a.n));
  stk.appendChild(b);a.el=b;
});
function renderStickers(){
  let n=0;
  A.forEach(a=>{const on=!!S.ach[a.id];n+=on;a.el.textContent=on?a.e:'?';a.el.classList.toggle('lock',!on);a.el.title=a.n;a.el.setAttribute('aria-label',a.n+(on?'':' (bloqueada)'))});
  $('#stcount').textContent=n+'/'+A.length;
}
function checkAch(){
  A.forEach(a=>{
    if(S.ach[a.id]||!a.t())return;
    S.ach[a.id]=true;renderStickers();
    a.el.classList.remove('new');void a.el.offsetWidth;a.el.classList.add('new');
    toast('¡Pegatina nueva! '+a.e+' '+a.n);SFX.sticker();save();
  });
}

function render(){
  const i=ips();
  setText(coinsEl,fmt(S.c));
  setText(ipsEl,i.toFixed(i<10?1:0));
  setText(totEl,fmt(S.tot));
  U.forEach(u=>{
    const lv=S[u.k],p=cost(u),mx=lv>=u.max,dis=hold||mx||S.c<p;
    if(u.lv!==lv){ // solo cuando cambia de nivel
      u.lv=lv;setText(u.nEl,u.c+' '+lv);setText(u.pEl,mx?'MÁX':fmt(p)+' ✿');
      u.el.setAttribute('aria-label',u.n+', nivel '+lv+'. '+u.d);u.el.classList.toggle('max',mx);
    }
    if(u.el.disabled!==dis)u.el.disabled=dis;
  });
  const lvl=S.h===0?0:(S.h<4?1:2);
  if(lvl!==hammerLvl){hammerLvl=lvl;ham.innerHTML=HAMMER[lvl]}
  if(helper._p!==S.p){helper._p=S.p;helper.classList.toggle('active',S.p>0);helper.style.setProperty('--hs',Math.max(.4,1.5-S.p*.13)+'s')}
  helper2.classList.toggle('active',S.a>0);
  setText(startBest,S.best?'Récord: '+S.best+' castores en una ronda':'');
  checkAch();
}
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const off=Math.min((Date.now()-S.t)/1000,28800);
if(off>30&&ips()>0){const g=ips()*off*.5;S.c+=g;toast('Mientras no estabas, el conejito juntó '+fmt(g)+' ✿')}

/* Borrar partida: lo deja todo como la primera vez (menos el sonido y el modo ratón/teclado) */
const rb=$('#reset');let armed=0;
rb.addEventListener('click',()=>{
  if(!armed){armed=1;rb.textContent='¿Seguro? Toca otra vez';setTimeout(()=>{armed=0;rb.textContent='Borrar partida'},3000);return}
  const mute=S.mute,kbd=S.kbd;S=fresh();S.mute=mute;S.kbd=kbd;armed=0;rb.textContent='Borrar partida';
  clearTimeout(pauseTimer);hideAll();
  hp=hpMax();over=false;paused=false;combo=0;curStage=0;
  ov.classList.remove('show');win.classList.remove('show');resumeGame();
  setSeason();save();renderStickers();render();renderLog();
});

setInterval(()=>{if(!over&&!hold)S.c+=ips()/10;render()},100); // en pausa el conejito tampoco recoge
setInterval(save,3000);
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();pauseGame()}});
setMode();setSeason();renderStickers();render();renderLog();spawn();throwAcorn();
</script>
</body>
</html>
